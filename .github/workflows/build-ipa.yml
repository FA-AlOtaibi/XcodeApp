name: Build DepthLight V4 Re-signable IPA

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project DepthLight.xcodeproj \
            -scheme DepthLight \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Prepare re-signable app bundle
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "DepthLight.app" -print -quit)
          test -n "$APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist"
          test -x "$APP_PATH/DepthLight"
          codesign --force --sign - --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "DepthLight.app" -print -quit)
          rm -rf Payload
          mkdir -p Payload
          ditto "$APP_PATH" Payload/DepthLight.app
          /usr/bin/zip -qry DepthLight-V4-Resignable.ipa Payload
          shasum -a 256 DepthLight-V4-Resignable.ipa > DepthLight-V4-Resignable.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DepthLight-V4-Resignable-IPA
          path: |
            DepthLight-V4-Resignable.ipa
            DepthLight-V4-Resignable.ipa.sha256
            build.log
          if-no-files-found: error
