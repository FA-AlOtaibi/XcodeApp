name: Build Hammel IPA
on:
  push:
    branches: [hammel-ipa-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Add HTDemucs CoreML runtime
        working-directory: HammelBuild
        run: |
          set -euo pipefail
          rm -rf /tmp/demucs-model /tmp/demucs.zip V11/HTDemucs_SourceSeparation_F32.mlpackage V11/DemucsVendor.swift
          mkdir -p /tmp/demucs-model
          curl -L --fail --retry 3 -o /tmp/demucs.zip https://github.com/john-rocky/CoreML-Models/releases/download/demucs-v1/HTDemucs_SourceSeparation_F32.mlpackage.zip
          unzip -q /tmp/demucs.zip -d /tmp/demucs-model
          MODEL_PATH="$(find /tmp/demucs-model -type d -name 'HTDemucs_SourceSeparation_F32.mlpackage' | head -1)"
          test -n "$MODEL_PATH"
          cp -R "$MODEL_PATH" V11/HTDemucs_SourceSeparation_F32.mlpackage
          curl -L --fail --retry 3 -o V11/DemucsVendor.swift https://raw.githubusercontent.com/john-rocky/CoreML-Models/master/sample_apps/DemucsDemo/DemucsDemo/ContentView.swift
          python3 - <<'PY'
          from pathlib import Path
          p = Path('V11/DemucsVendor.swift')
          s = p.read_text()
          for old,new in [
              ('AudioFilePickerView','DemucsSampleAudioFilePickerView'),
              ('StemPlayerView','DemucsSampleStemPlayerView'),
              ('ShareSheet','DemucsSampleShareSheet'),
              ('ContentView','DemucsSampleContentView'),
              ('private var stemURLs: [Stem: URL] = [:]','var stemURLs: [Stem: URL] = [:]'),
              ('private func performSeparation(mode: SeparationMode) async throws','func performSeparation(mode: SeparationMode) async throws'),
              ('config.computeUnits = .cpuOnly','config.computeUnits = .cpuAndGPU')
          ]: s = s.replace(old,new)
          p.write_text(s)
          PY

      - name: Apply source fixes
        working-directory: HammelBuild
        run: python3 ../.github/scripts/hammel_v33.py

      - name: Generate Xcode project
        working-directory: HammelBuild
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: HammelBuild
        run: |
          rm -rf build
          xcodebuild \
            -project Hammel.xcodeproj \
            -scheme Hammel \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            clean build

      - name: Package IPA
        working-directory: HammelBuild
        run: |
          test -d build/Hammel.app
          rm -rf Payload Hammel-fixed.ipa
          mkdir Payload
          cp -R build/Hammel.app Payload/Hammel.app
          /usr/bin/zip -qry Hammel-fixed.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hammel-v3.3-Fixed
          path: HammelBuild/Hammel-fixed.ipa
          if-no-files-found: error
