name: Build Hammel IPA
on:
  push:
    branches: [hammel-ipa-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Wire playback and media fixes
        working-directory: HammelBuild
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Fix compact helper declarations generated on one line.
          p = Path('V11/FullMediaSuite.swift')
          s = p.read_text()
          s = s.replace('])}private func run(', '])}; private func run(')
          s = s.replace('])}private func crop(', '])}; private func crop(')
          s = s.replace('}}private func format(', '}}; private func format(')
          p.write_text(s)

          # Route old feature buttons to the corrected implementations.
          for p in Path('V11').glob('*.swift'):
              s = p.read_text()
              s = s.replace('model.translateVideoToSRT(', 'model.translateVideoToSRTFixed(')
              s = s.replace('model.separateCenterAudio(', 'model.separateCenterAudioFixed(')
              p.write_text(s)

          # Add a persistent mini-player under the current tab content.
          p = Path('V11/Views.swift')
          s = p.read_text()
          s = s.replace(
              '}.tint(T.olive).overlay(alignment:.top)',
              '}.tint(T.olive).safeAreaInset(edge:.bottom,spacing:0){MiniPlaybackBar()}.overlay(alignment:.top)'
          )

          replacement = r'''struct LibraryCompactRow: View {
    @ObservedObject var model:AppModel
    let item:LocalMedia
    let selecting:Bool
    let selected:Bool
    let toggle:()->Void
    let actions:()->Void

    var body: some View {
        HStack(spacing:9) {
            if selecting {
                Button(action:toggle) {
                    Image(systemName:selected ? "checkmark.circle.fill":"circle")
                        .font(.title3)
                        .foregroundStyle(selected ? T.olive:.secondary)
                }
            }

            if selecting {
                Button(action:toggle) { content }.buttonStyle(.plain)
            } else if item.isVideo || item.isAudio {
                Button { PlaybackCenter.shared.play(item) } label: { content }
                    .buttonStyle(.plain)
            } else {
                NavigationLink { MediaDetailView(model:model,item:item) } label: { content }
                    .buttonStyle(.plain)
            }

            Spacer(minLength:2)
            if !selecting {
                Button(action:actions) { Image(systemName:"ellipsis").frame(width:32,height:32) }
            }
        }
        .padding(.horizontal,9)
        .padding(.vertical,5)
        .background(.thinMaterial,in:RoundedRectangle(cornerRadius:14))
    }

    private var content: some View {
        HStack(spacing:9) {
            LocalThumb(item:item).frame(width:48,height:42).clipShape(RoundedRectangle(cornerRadius:9))
            VStack(alignment:.leading,spacing:2) {
                Text(item.url.deletingPathExtension().lastPathComponent).font(.subheadline.weight(.semibold)).lineLimit(1)
                Text(model.formattedBytes(item.size)).font(.caption2).foregroundStyle(.secondary)
            }
        }
    }
}

struct CompactMediaRow'''
          s, n = re.subn(r'struct LibraryCompactRow: View \{.*?\n\}\n\nstruct CompactMediaRow', replacement, s, flags=re.S)
          if n != 1:
              raise SystemExit(f'LibraryCompactRow patch count = {n}')
          p.write_text(s)
          PY
      - name: Generate Xcode project
        working-directory: HammelBuild
        run: xcodegen generate
      - name: Build unsigned device app
        working-directory: HammelBuild
        run: |
          rm -rf build
          xcodebuild \
            -project Hammel.xcodeproj \
            -scheme Hammel \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            clean build
      - name: Package IPA
        working-directory: HammelBuild
        run: |
          test -d build/Hammel.app
          rm -rf Payload
          mkdir Payload
          cp -R build/Hammel.app Payload/Hammel.app
          /usr/bin/zip -qry Hammel-unsigned.ipa Payload
          ls -lh Hammel-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hammel-unsigned-IPA
          path: HammelBuild/Hammel-unsigned.ipa
          if-no-files-found: error
