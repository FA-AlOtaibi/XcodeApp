name: Build Hammel IPA
on:
  push:
    branches: [hammel-ipa-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Add HTDemucs CoreML runtime
        working-directory: HammelBuild
        run: |
          set -euo pipefail
          rm -rf /tmp/demucs-model /tmp/demucs.zip V11/HTDemucs_SourceSeparation_F32.mlpackage V11/DemucsVendor.swift
          mkdir -p /tmp/demucs-model
          curl -L --fail --retry 3 \
            -o /tmp/demucs.zip \
            https://github.com/john-rocky/CoreML-Models/releases/download/demucs-v1/HTDemucs_SourceSeparation_F32.mlpackage.zip
          unzip -q /tmp/demucs.zip -d /tmp/demucs-model
          MODEL_PATH="$(find /tmp/demucs-model -type d -name 'HTDemucs_SourceSeparation_F32.mlpackage' | head -1)"
          test -n "$MODEL_PATH"
          cp -R "$MODEL_PATH" V11/HTDemucs_SourceSeparation_F32.mlpackage

          curl -L --fail --retry 3 \
            -o V11/DemucsVendor.swift \
            https://raw.githubusercontent.com/john-rocky/CoreML-Models/master/sample_apps/DemucsDemo/DemucsDemo/ContentView.swift

          python3 - <<'PY'
          from pathlib import Path
          p = Path('V11/DemucsVendor.swift')
          s = p.read_text()
          s = s.replace('AudioFilePickerView', 'DemucsSampleAudioFilePickerView')
          s = s.replace('StemPlayerView', 'DemucsSampleStemPlayerView')
          s = s.replace('ShareSheet', 'DemucsSampleShareSheet')
          s = s.replace('ContentView', 'DemucsSampleContentView')
          s = s.replace('private var stemURLs: [Stem: URL] = [:]', 'var stemURLs: [Stem: URL] = [:]')
          s = s.replace('private func performSeparation(mode: SeparationMode) async throws', 'func performSeparation(mode: SeparationMode) async throws')
          s = s.replace('config.computeUnits = .cpuOnly', 'config.computeUnits = .cpuAndGPU')
          p.write_text(s)
          PY

      - name: Wire media features
        working-directory: HammelBuild
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('V11/FullMediaSuite.swift')
          s = p.read_text()
          s = s.replace('])}private func run(', '])}; private func run(')
          s = s.replace('])}private func crop(', '])}; private func crop(')
          s = s.replace('}}private func format(', '}}; private func format(')
          p.write_text(s)

          for p in Path('V11').glob('*.swift'):
              if p.name == 'DemucsVendor.swift':
                  continue
              s = p.read_text()
              s = s.replace('model.translateVideoToSRT(', 'model.translateVideoToSRTComplete(')
              s = s.replace('model.translateVideoToSRTFixed(', 'model.translateVideoToSRTComplete(')
              s = s.replace('model.separateCenterAudioFast(', 'model.separateWithDemucs(')
              s = s.replace('model.separateCenterAudioFixed(', 'model.separateWithDemucs(')
              s = s.replace('model.separateCenterAudio(', 'model.separateWithDemucs(')
              p.write_text(s)

          p = Path('V11/Views.swift')
          s = p.read_text()
          s = s.replace('}.tint(T.olive).overlay(alignment:.top)', '}.tint(T.olive).safeAreaInset(edge:.bottom,spacing:0){FloatingPlaybackDock()}.overlay(alignment:.top)')
          s = s.replace('Text("نزّل. رتّب. استخدم.").font(.caption).foregroundStyle(.secondary)', 'EmptyView()')

          old = 'else{NavigationLink{MediaDetailView(model:model,item:item)}label:{content}.buttonStyle(.plain)}'
          new = 'else{Group{if item.isVideo || item.isAudio{Button{PlaybackCenter.shared.play(item)}label:{content}.buttonStyle(.plain)}else if item.ext.lowercased()=="srt" || item.ext.lowercased()=="txt"{NavigationLink{SubtitleViewerView(item:item)}label:{content}.buttonStyle(.plain)}else{NavigationLink{MediaDetailView(model:model,item:item)}label:{content}.buttonStyle(.plain)}}}'
          if old in s:
              s = s.replace(old, new, 1)

          s = s.replace('NavigationLink{MediaDetailView(model:model,item:i)}label:{CompactMediaRow(item:i,model:model)}', 'NavigationLink{Group{if i.ext.lowercased()=="srt" || i.ext.lowercased()=="txt"{SubtitleViewerView(item:i)}else{MediaDetailView(model:model,item:i)}}}label:{CompactMediaRow(item:i,model:model)}')

          old_row = 'LibraryCompactRow(model:model,item:i,selecting:selecting,selected:selected.contains(i.id),toggle:{toggle(i)},actions:{actionItem=i})'
          new_row = 'SwipeLibraryRow(model:model,item:i,selecting:selecting,selected:selected.contains(i.id),toggle:{toggle(i)},actions:{actionItem=i})'
          s = s.replace(old_row, new_row)
          p.write_text(s)
          PY

      - name: Generate Xcode project
        working-directory: HammelBuild
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: HammelBuild
        run: |
          rm -rf build
          xcodebuild \
            -project Hammel.xcodeproj \
            -scheme Hammel \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            clean build
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' build/Hammel.app/Info.plist

      - name: Package IPA
        working-directory: HammelBuild
        run: |
          test -d build/Hammel.app
          rm -rf Payload
          mkdir Payload
          cp -R build/Hammel.app Payload/Hammel.app
          /usr/bin/zip -qry Hammel-unsigned.ipa Payload
          ls -lh Hammel-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hammel-unsigned-IPA
          path: HammelBuild/Hammel-unsigned.ipa
          if-no-files-found: error
