name: Build Hammel IPA
on:
  push:
    branches: [hammel-ipa-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Wire playback and media fixes
        working-directory: HammelBuild
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('V11/FullMediaSuite.swift')
          s = p.read_text()
          s = s.replace('])}private func run(', '])}; private func run(')
          s = s.replace('])}private func crop(', '])}; private func crop(')
          s = s.replace('}}private func format(', '}}; private func format(')
          p.write_text(s)

          for p in Path('V11').glob('*.swift'):
              s = p.read_text()
              s = s.replace('model.translateVideoToSRT(', 'model.translateVideoToSRTFixed(')
              s = s.replace('model.separateCenterAudio(', 'model.separateCenterAudioFixed(')
              p.write_text(s)

          p = Path('V11/Views.swift')
          s = p.read_text()
          s = s.replace('}.tint(T.olive).overlay(alignment:.top)', '}.tint(T.olive).safeAreaInset(edge:.bottom,spacing:0){MiniPlaybackBar()}.overlay(alignment:.top)')
          old = 'else{NavigationLink{MediaDetailView(model:model,item:item)}label:{content}.buttonStyle(.plain)}'
          new = 'else{Group{if item.isVideo || item.isAudio{Button{PlaybackCenter.shared.play(item)}label:{content}.buttonStyle(.plain)}else{NavigationLink{MediaDetailView(model:model,item:item)}label:{content}.buttonStyle(.plain)}}}'
          if old not in s:
              raise SystemExit('Library row patch target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Generate Xcode project
        working-directory: HammelBuild
        run: xcodegen generate
      - name: Build unsigned device app
        working-directory: HammelBuild
        run: |
          rm -rf build
          xcodebuild \
            -project Hammel.xcodeproj \
            -scheme Hammel \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            clean build
      - name: Package IPA
        working-directory: HammelBuild
        run: |
          test -d build/Hammel.app
          rm -rf Payload
          mkdir Payload
          cp -R build/Hammel.app Payload/Hammel.app
          /usr/bin/zip -qry Hammel-unsigned.ipa Payload
          ls -lh Hammel-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hammel-unsigned-IPA
          path: HammelBuild/Hammel-unsigned.ipa
          if-no-files-found: error
