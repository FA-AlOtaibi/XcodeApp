name: Build FPS Converter IPA
on:
  push:
    branches: [fps-converter-ios]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Bundle PiperSR AI model
        run: |
          rm -rf /tmp/PiperSR
          git clone --depth 1 https://github.com/ModelPiper/PiperSR.git /tmp/PiperSR
          rm -rf FPSConverterApp/FPSConverter/PiperSR_2x.mlpackage
          cp -R /tmp/PiperSR/PiperSR_2x.mlpackage FPSConverterApp/FPSConverter/
      - name: Generate project
        working-directory: FPSConverterApp
        run: xcodegen generate
      - name: Build unsigned device app
        working-directory: FPSConverterApp
        run: |
          xcodebuild -project FPSConverter.xcodeproj -scheme FPSConverter -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        working-directory: FPSConverterApp
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FPSConverter.app Payload/
          zip -qry FPSConverter_Unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FPSConverter_Unsigned_IPA
          path: FPSConverterApp/FPSConverter_Unsigned.ipa
