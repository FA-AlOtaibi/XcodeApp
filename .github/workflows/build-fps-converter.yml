name: Build ScreenFlow UIKit IPA
on:
  push:
    branches: [screenflow-uikit-native]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          brew install xcodegen git-lfs
          git lfs install
      - name: Bundle PiperSR AI model
        run: |
          rm -rf /tmp/PiperSRHF
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://huggingface.co/ModelPiper/PiperSR-2x /tmp/PiperSRHF
          git -C /tmp/PiperSRHF lfs pull
          test -f /tmp/PiperSRHF/PiperSR_2x.mlpackage/Data/com.apple.CoreML/model.mlmodel
          test -f /tmp/PiperSRHF/PiperSR_2x.mlpackage/Data/com.apple.CoreML/weights/weight.bin
          rm -rf FPSConverterApp/FPSConverter/PiperSR_2x.mlpackage
          cp -R /tmp/PiperSRHF/PiperSR_2x.mlpackage FPSConverterApp/FPSConverter/
      - name: Generate project
        working-directory: FPSConverterApp
        run: xcodegen generate
      - name: Build unsigned device app
        working-directory: FPSConverterApp
        run: |
          xcodebuild -project FPSConverter.xcodeproj -scheme FPSConverter -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        working-directory: FPSConverterApp
        run: |
          rm -rf Payload ScreenFlow_UIKit_Unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ScreenFlow.app Payload/
          zip -qry ScreenFlow_UIKit_Unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenFlow_UIKit_Unsigned_IPA
          path: FPSConverterApp/ScreenFlow_UIKit_Unsigned.ipa
