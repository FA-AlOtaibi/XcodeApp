name: Build ScreenFlow UIKit IPA
on:
  push:
    branches: [screenflow-uikit-native]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          brew install xcodegen
      - name: Bundle Real-ESRGAN x2 CoreML model
        run: |
          rm -rf /tmp/realesrgan /tmp/realesrgan.zip
          mkdir -p /tmp/realesrgan
          curl -L --fail --retry 3 \
            https://github.com/hanxiao/real-esrgan-coreml/releases/download/v1.0.0/RealESRGAN_x2plus_522_fp16.zip \
            -o /tmp/realesrgan.zip
          unzip -q /tmp/realesrgan.zip -d /tmp/realesrgan
          MODEL=$(find /tmp/realesrgan -type d -name '*.mlpackage' | head -1)
          test -n "$MODEL"
          rm -rf FPSConverterApp/FPSConverter/RealESRGAN_x2plus_522_fp16.mlpackage
          cp -R "$MODEL" FPSConverterApp/FPSConverter/RealESRGAN_x2plus_522_fp16.mlpackage
      - name: Generate project
        working-directory: FPSConverterApp
        run: xcodegen generate
      - name: Build unsigned device app
        working-directory: FPSConverterApp
        run: |
          xcodebuild -project FPSConverter.xcodeproj -scheme FPSConverter -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        working-directory: FPSConverterApp
        run: |
          rm -rf Payload ScreenFlow_UIKit_Unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ScreenFlow.app Payload/
          zip -qry ScreenFlow_UIKit_Unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenFlow_UIKit_Unsigned_IPA
          path: FPSConverterApp/ScreenFlow_UIKit_Unsigned.ipa
