name: DepthLight
options:
  bundleIdPrefix: com.fahad
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  DepthLight:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "DepthLight V4"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "4.0"
        CFBundleVersion: "4"
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "DepthLight uses the TrueDepth camera for real-time face relighting and hand occlusion."
        NSPhotoLibraryAddUsageDescription: "DepthLight saves photos you capture to your photo library."
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fahad.depthlightv4
        PRODUCT_NAME: DepthLight
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
schemes:
  DepthLight:
    build:
      targets:
        DepthLight: all
    run:
      config: Debug
    archive:
      config: Release
