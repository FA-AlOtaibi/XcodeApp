name: DepthLight
options:
  bundleIdPrefix: com.fahad
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  DepthLight:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fahad.depthlight
        PRODUCT_NAME: DepthLight
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
schemes:
  DepthLight:
    build:
      targets:
        DepthLight: all
    run:
      config: Debug
    archive:
      config: Release
