name: ObjectStudio
options:
  bundleIdPrefix: com.fahad
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.0
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ''
targets:
  ObjectStudio:
    type: application
    platform: iOS
    sources:
      - ObjectStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fahad.objectstudio
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Object Studio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: نحتاج الوصول للصور لاختيار صور المنتجات.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: نحتاج حفظ النتائج في مكتبة الصور.
        INFOPLIST_KEY_NSCameraUsageDescription: نحتاج الكاميرا لتصوير المنتج مباشرة.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
    scheme:
      testTargets: []
