name: PlantPersona
options:
  bundleIdPrefix: com.fahad
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: 1
    PRODUCT_BUNDLE_IDENTIFIER: com.fahad.PlantPersona
    CODE_SIGN_STYLE: Automatic
targets:
  PlantPersona:
    type: application
    platform: iOS
    sources:
      - path: PlantPersona
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: PlantPersona
        INFOPLIST_FILE: PlantPersona/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.fahad.PlantPersona
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
